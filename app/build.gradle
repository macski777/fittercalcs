plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sprinkler.pipechart'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sprinkler.pipechart'
        minSdk 24
        targetSdk 34
        versionCode 42
        versionName '2.31'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
